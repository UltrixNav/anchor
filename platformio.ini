; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
lib_deps = 
	f-army/DW1000-ng@^0.1.0
; --- Anchor Mode Selection ---
; TDOA3 (Time Difference of Arrival) - Default mode
; Anchor transmits packets with time information, tag/solver calculates position
; build_flags = 
	; -D ANCHOR_MODE_TDOA3=1

; --- Alternative: TWR (Two-Way Ranging) Mode ---
; Uncomment below to enable TWR mode
; Anchor responds to POLL from tag and sends REPORT with timing info
build_flags = 
	-D ANCHOR_MODE_TWR=1